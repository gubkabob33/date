<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff4d6d; font-size: 24px; margin-bottom: 20px; }
        p { color: #4a4a4a; font-size: 16px; }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #a0a0a0; color: white; position: absolute; }
        .hidden { display: none; }
        .form-group {
            text-align: left;
            margin-top: 15px;
        }
        label { display: block; color: #ff4d6d; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #ff4d6d; }
        #submitBtn { background-color: #ff4d6d; color: white; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- СТРАНИЦА 1: ВОПРОС -->
    <div class="container" id="page1">
        <h1>Will you go on a date with me? 🌹</h1>
        <p>Think carefully...</p>
        <div class="btn-group">
            <button id="yesBtn" onclick="nextPage()">Yes!</button>
            <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <!-- СТРАНИЦА 2: АНКЕТА -->
    <div class="container hidden" id="page2">
        <h1>Yay! Let's plan it out 🥰</h1>
        
        <!-- Замени ссылку в action на свою форму, если хочешь получать ответы на почту -->
        <form action="https://formspree.io" method="POST" id="dateForm">
            <div class="form-group">
                <label>What day works best for you?</label>
                <input type="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label>What time?</label>
                <input type="time" name="time" required>
            </div>

            <div class="form-group">
                <label>What food do you prefer?</label>
                <select name="food">
                    <option value="Italian">Italian 🍝</option>
                    <option value="Asian/Sushi">Asian & Sushi 🥢</option>
                    <option value="Burgers/Steaks">Burgers & Steaks 🍔</option>
                    <option value="Coffee & Desserts">Just Coffee & Desserts ☕</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your favorite flowers/colors?</label>
                <input type="text" name="details" placeholder="Roses, tulips, pink, etc..." required>
            </div>

            <button type="submit" id="submitBtn">Send to him ✨</button>
        </form>
    </div>

    <!-- СТРАНИЦА 3: ФИНАЛ -->
    <div class="container hidden" id="page3">
        <h1>It's a date! 📅❤️</h1>
        <p>I can't wait to see you. I will check the details and text you!</p>
    </div>

    <script>
        // Убегающая кнопка "No"
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('page1');
            
            // Ограничиваем область бега рамками контейнера
            const maxX = container.clientWidth - noBtn.clientWidth - 20;
            const maxY = container.clientHeight - noBtn.clientHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Переход на страницу с анкетой
        function nextPage() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        // Обработка отправки формы
        document.getElementById('dateForm').addEventListener('submit', function(e) {
            // Если используешь Formspree, сотри строчку e.preventDefault() ниже
            e.preventDefault(); 
            
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden');
        });
    </script>
</body>
</html>
