<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <script>
        // ВСТАВЬ СВОЮ ССЫЛКУ ИЗ FORMSPREE МЕЖДУ КАВЫЧКАМИ НИЖЕ:
        const FORMSPREE_LINK = 'https://formspree.io/f/moealzwz';
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>I have a question...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.15);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
            box-sizing: border-box;
        }
        h1 { color: #ff4d6d; font-size: 26px; margin-bottom: 25px; }
        p { color: #666; font-size: 16px; margin-bottom: 20px; }
        
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            position: relative;
            height: 80px;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        #yesBtn { 
            background-color: #ff4d6d; 
            color: white; 
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
            z-index: 12;
        }
        #noBtn { 
            background-color: #a0a0a0; 
            color: white; 
            z-index: 11;
            transition: transform 0.1s ease, left 0.1s ease, top 0.1s ease;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .options-grid.days {
            grid-template-columns: repeat(4, 1fr);
        }
        .opt-btn {
            background-color: #fff0f3;
            color: #ff4d6d;
            border: 2px solid #ffccd5;
            padding: 12px;
            font-size: 14px;
            border-radius: 15px;
        }
        .opt-btn:hover {
            background-color: #ff4d6d;
            color: white;
            border-color: #ff4d6d;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            box-sizing: border-box;
            font-size: 15px;
            margin-top: 15px;
            outline: none;
        }
        .submit-btn { background-color: #ff4d6d; color: white; width: 100%; margin-top: 20px; }

        .hidden { display: none !important; }

        .flower {
            position: absolute;
            top: -20px;
            font-size: 24px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- STEP 1 -->
    <div class="container" id="step1">
        <h1>Will you go on a date with me? 🌹</h1>
        <p>Think carefully...</p>
        <div class="btn-group" id="mainArea">
            <button id="yesBtn" onclick="handleYesClick()">Yes!</button>
            <button id="noBtn" onmouseover="moveAndShrinkNoButton()" onclick="moveAndShrinkNoButton()">No</button>
        </div>
    </div>

    <!-- STEP 2 -->
    <div class="container hidden" id="step2">
        <h1>Yay! I knew it! 🥰</h1>
        <p>What day works best for you?</p>
        <div class="options-grid days">
            <button class="opt-btn" onclick="showStep('step3')">Mon</button>
            <button class="opt-btn" onclick="showStep('step3')">Tue</button>
            <button class="opt-btn" onclick="showStep('step3')">Wed</button>
            <button class="opt-btn" onclick="showStep('step3')">Thu</button>
            <button class="opt-btn" onclick="showStep('step3')">Fri</button>
            <button class="opt-btn" onclick="showStep('step3')">Sat</button>
            <button class="opt-btn" onclick="showStep('step3')">Sun</button>
        </div>
    </div>

    <!-- STEP 3 -->
    <div class="container hidden" id="step3">
        <h1>Nice ✨</h1>
        <p>What time of day do you prefer?</p>
        <div class="options-grid">
            <button class="opt-btn" onclick="showStep('step4')">Morning </button>
            <button class="opt-btn" onclick="showStep('step4')">Afternoon </button>
            <button class="opt-btn" onclick="showStep('step4')">Evening </button>
            <button class="opt-btn" onclick="showStep('step4')">Night </button> 
       </div>
    </div>

    <!-- STEP 4 -->
    <div class="container hidden" id="step4">
        <h1>What are we eating? 😋</h1>
        <p>Choose your vibe:</p>
        <div class="options-grid">
            <button class="opt-btn" onclick="showStep('step5')">Uzbek cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Pan-Asian cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Korean cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Turkish cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Russian cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Italian cuisine </button>
            <button class="opt-btn" onclick="showStep('step5')">Coffee shops & Bakeries </button>
        </div>
    </div>

    <!-- STEP 5 -->
    <div class="container hidden" id="step5">
        <h1>Almost done! 🌸</h1>
        <p>What are your favorite flowers?</p>
        <input type="text" id="flowersInput" placeholder="Roses, tulips, lilies, sunflowers, daisies, orchids, peonies, carnations">
        <button class="submit-btn" onclick="showStep('step6')">Send details to her ✨</button>
    </div>

    <!-- STEP 6 -->
    <div class="container hidden" id="step6">
        <h1>It's a date! 📅❤️</h1>
        <p>Thanks for your time. Can't wait to see you!</p>
    </div>

    <script>
        let noScale = 1.0;
        let isCelebrating = false;

        function moveAndShrinkNoButton() {
            const noBtn = document.getElementById('noBtn');
            const area = document.getElementById('mainArea');
            
            noScale -= 0.12;
            if (noScale < 0.15) noScale = 0.15;
            
            const maxX = area.clientWidth - 80;
            const maxY = 150;
            
            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - 50;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = `calc(50% + ${randomX}px)`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.transform = `scale(${noScale})`;
        }

        function handleYesClick() {
            isCelebrating = true;
            startFlowerRain();
            showStep('step2');
        }

        function showStep(stepId) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(stepId).classList.remove('hidden');
        }

        function startFlowerRain() {
            const flowers = ['🌸', '🌹', '🌷', '🌺', '✨', '💕'];
            setInterval(() => {
                if (!isCelebrating) return;
                const flower = document.createElement('div');
                flower.classList.add('flower');
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.animationDuration = Math.random() * 2 + 3 + 's';
                flower.style.opacity = Math.random() * 0.7 + 0.3;
                document.body.appendChild(flower);
                setTimeout(() => flower.remove(), 5000);
            }, 250);
        }
    </script>
</body>
</html>
